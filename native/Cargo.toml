[package]
name = "twinflame_native"
version = "0.1.0"
edition = "2021"
description = "Native SimHash signature accelerator for twinflame"

[lib]
name = "twinflame_rs"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

# Core is std-only (compiles offline). The Python binding is opt-in behind the
# `python` feature so `cargo test` never needs pyo3.
[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }

[features]
python = ["dep:pyo3"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
